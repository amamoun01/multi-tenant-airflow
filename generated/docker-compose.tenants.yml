services:
  tenant-a-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks: &id001
    - airflow-platform-net
  tenant-a-init:
    image: apache/airflow:3.0.3
    restart: 'no'
    depends_on:
    - tenant-a-db
    - redis
    environment: &id002
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@tenant-a-db/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@tenant-a-db/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    command: bash -c 'airflow db migrate'
    networks: *id001
  tenant-a-api-server:
    image: apache/airflow:3.0.3
    command: api-server
    restart: always
    depends_on:
    - tenant-a-init
    environment: *id002
    labels:
    - traefik.enable=true
    - traefik.http.routers.tenant-a.rule=Host(`tenant-a.localhost`)
    - traefik.http.routers.tenant-a.entrypoints=web
    - traefik.http.services.tenant-a.loadbalancer.server.port=8080
    networks: *id001
  tenant-a-scheduler:
    image: apache/airflow:3.0.3
    command: scheduler
    restart: always
    depends_on:
    - tenant-a-init
    environment: *id002
    networks: *id001
  tenant-a-triggerer:
    image: apache/airflow:3.0.3
    command: triggerer
    restart: always
    depends_on:
    - tenant-a-init
    environment: *id002
    networks: *id001
  tenant-a-dag-processor:
    image: apache/airflow:3.0.3
    command: dag-processor
    restart: always
    depends_on:
    - tenant-a-init
    environment: *id002
    networks: *id001
  tenant-a-worker-1:
    image: apache/airflow:3.0.3
    command: celery worker
    restart: always
    depends_on:
    - tenant-a-init
    environment: *id002
    networks: *id001
